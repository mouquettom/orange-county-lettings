name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:

  # -------------------------------------------------------
  # 1. Vérification du projet
  # -------------------------------------------------------
  tests:
    name: Tests and code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: |
          flake8 oc_lettings_site lettings profiles manage.py

      - name: Generate static files
        run: |
          python manage.py collectstatic --noinput

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80


  # -------------------------------------------------------
  # 2. Construction et publication de l'image Docker
  # -------------------------------------------------------
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    # Ce job ne démarre que si le job "tests" réussit.
    needs: tests

    # On publie l'image uniquement lors d'un push sur master,
    # pas lors d'une simple Pull Request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/orange-county-lettings:latest
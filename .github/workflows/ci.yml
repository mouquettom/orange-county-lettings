name: CI

on:
  push:

  pull_request:
    branches:
      - master


jobs:

  # -------------------------------------------------------
  # 1. Project checks
  # -------------------------------------------------------
  tests:
    name: Tests and code quality
    runs-on: ubuntu-latest

    # DEBUG is disabled by default, so Django requires a SECRET_KEY.
    # This throwaway value is only used to run the checks.
    env:
      SECRET_KEY: ci-only-insecure-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Flake8
        run: |
          flake8 oc_lettings_site lettings profiles manage.py

      - name: Generate static files
        run: |
          python manage.py collectstatic --noinput

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80


  # -------------------------------------------------------
  # 2. Docker image build and publication
  # -------------------------------------------------------
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    # This job only starts if the "tests" job succeeds.
    needs: tests

    # The image is only published on a push to master,
    # not on a simple pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/orange-county-lettings:latest
            ${{ vars.DOCKERHUB_USERNAME }}/orange-county-lettings:${{ github.sha }}


  # -------------------------------------------------------
  # 3. Render deployment
  # -------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render deployment
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

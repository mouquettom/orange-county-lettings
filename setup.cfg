[flake8]
max-line-length = 99
exclude = **/migrations/*,venv,.venv

[tool:pytest]
DJANGO_SETTINGS_MODULE = oc_lettings_site.settings
python_files = tests.py test_*.py *_tests.py

[coverage:run]
# Measure the application code only: the tests themselves and the generated
# migrations would artificially raise the coverage rate.
omit =
    */migrations/*
    */tests/*
    docs/*
    .venv/*
    venv/*
